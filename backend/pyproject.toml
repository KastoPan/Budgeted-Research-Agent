[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "budgeted-research-agent"
version = "0.1.0"
description = "A budget-aware research agent with reproducible fixed and adaptive policies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.70,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "sqlalchemy>=2.0,<3",
  "trafilatura>=2,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.32,<1",
]

[project.scripts]
bra = "budgeted_research.cli.app:app"

[project.optional-dependencies]
dev = [
  "httpx2>=2.0,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.22,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/budgeted_research"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
